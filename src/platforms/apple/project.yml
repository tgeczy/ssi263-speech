# The Apple apps' Xcode project, made by XcodeGen (brew install xcodegen):
#     sh build_apple.sh && xcodegen generate        (here, in src/platforms/apple)
# The project it makes is not committed; this file is.  The native core comes from build_apple.sh's static libraries
# (build/apple/<platform>/libssi263core.a), the licences from its build/apple/licenses.  As TGSpeechBox's project:
# a host app and its speech extension (an AVSpeechSynthesisProviderAudioUnit) for macOS and for iOS, sharing an App
# Group, signed automatically for Tamas Geczy's team.
name: SSI263Speech
options:
  bundleIdPrefix: com.ssi263speech
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: P84QQE42U9
    CODE_SIGN_STYLE: Automatic
    # automatic signing registers the entitlements' App Group and signs with a profile that grants it: without it a
    # Mac target gets the team's wildcard profile, and macOS then refuses the extension the group's container
    # ("Requestor's signature does not allow it to access a TCC-protected group container")
    REGISTER_APP_GROUPS: YES
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: shared/BridgingHeader.h
    HEADER_SEARCH_PATHS:
      - $(PROJECT_DIR)/core
      - $(PROJECT_DIR)/../android/app/src/main/cpp
      - $(PROJECT_DIR)/../../csrc
      - $(PROJECT_DIR)/../../csrc/blazie
      - $(PROJECT_DIR)/../../csrc/cpu
    "LIBRARY_SEARCH_PATHS[sdk=macosx*]": $(PROJECT_DIR)/../../../build/apple/macos
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../../build/apple/ios
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../../build/apple/ios-simulator
    OTHER_LDFLAGS: [-lssi263core, -lc++]

targets:
  SsiSpeech-macOS:
    type: application
    platform: macOS
    attributes:
      # the App Groups capability, for automatic signing (REGISTER_APP_GROUPS above)
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: app
        excludes: ["*.entitlements"]
      - path: shared
      - path: ../../../build/apple/licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssi263speech.app
        PRODUCT_NAME: SSI-263 Speech
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SSI-263 Speech
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: app/SsiSpeech-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: SsiSynthExtension-macOS
        embed: true
        codeSign: true

  SsiSynthExtension-macOS:
    type: app-extension
    platform: macOS
    attributes:
      # the App Groups capability, for automatic signing (REGISTER_APP_GROUPS above)
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: extension
        excludes: ["*.entitlements", "Info.plist"]
      - path: shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssi263speech.app.synth-extension
        PRODUCT_NAME: SsiSynthExtension
        INFOPLIST_FILE: extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: extension/SsiSynthExtension-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  SsiSpeech-iOS:
    type: application
    platform: iOS
    attributes:
      # the App Groups capability, for automatic signing (REGISTER_APP_GROUPS above)
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: app
        excludes: ["*.entitlements"]
      - path: shared
      - path: ../../../build/apple/licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssi263speech.app
        PRODUCT_NAME: SSI-263 Speech
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SSI-263 Speech
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: app/SsiSpeech-iOS.entitlements
    dependencies:
      - target: SsiSynthExtension-iOS
        embed: true
        codeSign: true

  SsiSynthExtension-iOS:
    type: app-extension
    platform: iOS
    attributes:
      # the App Groups capability, for automatic signing (REGISTER_APP_GROUPS above)
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: extension
        excludes: ["*.entitlements", "Info.plist"]
      - path: shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssi263speech.app.synth-extension
        PRODUCT_NAME: SsiSynthExtension
        INFOPLIST_FILE: extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: extension/SsiSynthExtension-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
