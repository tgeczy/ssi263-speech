name = blazie_ssi263
summary = "Braille Lite / Braille 'n Speak (SSI-263 emulation)"
description = """A Blazie Braille Lite 2000 in speech-box mode, emulated, in English and Spanish: the unit's own June 2003 firmware runs on MAME's Z180 core and drives a register-level model of the Silicon Systems SSI-263 speech chip, whose A/R request drives the firmware back. The rules, number reading and inflection are the firmware's own, live. Nothing is recorded or concatenated.

Settings map to the unit's own: rate 1-16, pitch 1-63, tone 0-26 as the variant (the unit's own chords reach 0-16; speech-box mode takes the rest); the defaults are the unit's factory settings (rate 11, pitch 16, tone 7). Volume is applied digitally.

Runs on NVDA 2021.1 and later, 32- or 64-bit, Windows 7 and later; no numpy and no Visual C++ runtime needed.

This add-on carries the Braille Lite's own firmware, shared with permission. It is not ours; it is here so the unit can speak again, and it will be removed if its rights holders ask. Our code is MIT; MAME's Z180 core is BSD-3-Clause. The license notices are included. Source: https://github.com/tgeczy/ssi263-speech"""
author = "tgeczy (SSI-263 chip engine and driver, with Claude and Astra)"
url = "https://github.com/tgeczy/ssi263-speech"
version = 0.7.6
minimumNVDAVersion = 2021.1
lastTestedNVDAVersion = 2026.1

