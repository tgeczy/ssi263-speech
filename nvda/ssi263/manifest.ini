name = ssi263_speech
summary = "Votrax SC-02 / SSI-263 (emulated)"
description = """Every talking device of the ssi263-speech project in one synthesizer: the Braille Lite 2000 (English and Spanish), the Speak-Out, the Accent SA, the Accent-mini and the Mockingboard, each running its own original firmware on an emulated processor and driving a register-level model of the Silicon Systems SSI-263 (Votrax SC-02) speech chip. Nothing is recorded or concatenated; the chip model generates the sound.

Choose the unit with the Firmware setting (also in the settings ring); the voice is that firmware's language, so NVDA's automatic language switching works. Each unit keeps its own settings, and its settings are its 0.7 add-on's: what you hear is that add-on's, byte for byte. This add-on replaces the three 0.7 add-ons (Braille Lite / Braille 'n Speak, Speak-Out, Accent SA and Mini).

Runs on NVDA 2021.1 and later, 32- or 64-bit, Windows 7 and later; no numpy and no Visual C++ runtime needed.

This add-on carries the units' own firmware: the Braille Lite's (shared with permission), the Speak-Out's (GW Micro), Aicom's Accent firmware and Sweet Micro Systems' Mockingboard text-to-speech. It is not ours; it is here so the units can speak again, and it will be removed if its rights holders ask. Our code is MIT; MAME's cores are BSD-3-Clause; the 6502 core is Fake6502 (public domain) through EchoTalk (BSD-3-Clause). The license notices are included. Source: https://github.com/tgeczy/ssi263-speech"""
author = "tgeczy (SSI-263 chip engine and driver, with Claude and Astra)"
url = "https://github.com/tgeczy/ssi263-speech"
version = 0.8.0
minimumNVDAVersion = 2021.1
lastTestedNVDAVersion = 2026.1

[symbolDictionaries]
[[stackedq]]
displayName = Braille Lite: stacked question marks
mandatory = true
