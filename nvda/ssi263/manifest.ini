name = ssi263_speech
summary = "Votrax SC-02 / SSI-263 (emulated)"
description = """Every talking device of the ssi263-speech project in one synthesizer: the multilingual Braille Lite 2000, the Slovak Braille 'n Speak 2000, the Speak-Out, the Accent SA, the Accent-mini and the Mockingboard, each running its own original firmware on an emulated processor and driving a register-level model of the Silicon Systems SSI-263 (Votrax SC-02) speech chip. Nothing is recorded or concatenated; the chip model generates the sound.

Choose the unit with Firmware and its language with Voice; both are available in the settings ring. Each firmware type remembers its own settings in your NVDA profiles. The add-on carries over saved settings from the three 0.7 add-ons and offers to remove those older add-ons when NVDA restarts. You can keep them and remove them later from this add-on's settings page. Its update checker runs only when you choose "Check for updates..." under Tools, "SSI-263 speech chip synthesizer...".

Runs on NVDA 2021.1 and later, 32- or 64-bit, Windows 7 and later; no numpy and no Visual C++ runtime needed.

This add-on carries the units' own firmware: the Braille Lite's (shared with permission), the Speak-Out's and the Sounding Board's (GW Micro), Aicom's Accent firmware and Sweet Micro Systems' Mockingboard text-to-speech. It is not ours; it is here so the units can speak again, and it will be removed if its rights holders ask. Our code is MIT; MAME's cores are BSD-3-Clause; the 6502 core is Fake6502 (public domain) through EchoTalk (BSD-3-Clause). The license notices are included. Source: https://github.com/tgeczy/ssi263-speech"""
author = "tgeczy (SSI-263 chip engine and driver, with Claude and Astra)"
url = "https://github.com/tgeczy/ssi263-speech"
version = 0.9.1
minimumNVDAVersion = 2021.1
lastTestedNVDAVersion = 2026.1

[symbolDictionaries]
[[stackedq]]
displayName = Braille Lite: stacked question marks
mandatory = true
